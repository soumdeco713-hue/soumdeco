name: Auto-Sync Product Images

# ============================================================
#  AUTO-SYNC: Keeps /public/images/products/ in sync with the
#  Google Sheet. Runs every 15 minutes.
#
#  WHAT IT DOES:
#   1. Fetches the product list from Google Apps Script
#   2. Downloads new Cloudinary images to /public/images/products/
#   3. Deletes orphaned files (images for deleted products)
#   4. Rebuilds /public/image-manifest.json
#   5. Commits + pushes if anything changed
#   6. Cloudflare auto-rebuilds on push (2-3 min)
#
#  WHY 15 MINUTES:
#   - GitHub Actions free tier: 2000 min/month for private repos
#   - 15-min cron = 2880 runs/month × ~30 sec/run = 1440 min ✅
#   - Admin sees images instantly via Cloudinary (fallback)
#   - Within 15 min, images promoted to Pages (unlimited bandwidth)
#
#  ADMIN EXPERIENCE:
#   - Admin adds product → sees it instantly (Cloudinary)
#   - Within 15 min, image is on Pages (unlimited bandwidth)
#   - Admin deletes product → product disappears instantly
#   - Within 15 min, image files removed from repo → slots freed
#   - Admin sees NO code, NO terminal, NO scripts
#
#  SAFETY:
#   - Checks 20K file limit before adding (prevents deploy failure)
#   - Only commits if changes were made (no empty commits)
#   - Uses built-in GITHUB_TOKEN (no secrets to manage)
#   - Self-healing: if one run fails, the next catches up
# ============================================================

on:
  schedule:
    # Every 15 minutes (UTC)
    - cron: "*/15 * * * *"
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write # needed to commit changes

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # safety: don't run forever
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1 # shallow clone = faster

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run auto-sync
        run: python3 scripts/auto-sync.py

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Auto-Sync Bot"
          git config user.email "actions@github.com"
          git add public/images/products/ public/image-manifest.json
          git commit -m "auto-sync: update product images [skip ci]

          Automated sync of product images from Cloudinary to Cloudflare Pages.
          Triggered by: ${{ github.event_name }}
          Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push
