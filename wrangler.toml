name = "soumdeco"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Required by Cloudflare Pages
pages_build_output_dir = ".vercel/output/static"

# ============================================================
#  KV NAMESPACE + R2 BUCKET (OPTIONAL — added when ready)
# ============================================================
#
#  The site works WITHOUT these bindings — it falls back to
#  direct Google Apps Script fetches + Cloudinary image uploads.
#
#  When you're ready to enable KV caching and R2 image storage,
#  create the resources and UNCOMMENT the sections below.
#
#  --- KV (product + stock cache, 3-min TTL) ---
#  Create:  npx wrangler kv namespace create CATALOG_KV
#  Preview: npx wrangler kv namespace create CATALOG_KV --preview
#  Then paste the real IDs (NOT placeholders!) and uncomment:
#
#  [[kv_namespaces]]
#  binding = "CATALOG_KV"
#  id = "abc123def456..."        # real id from the create command
#  preview_id = "zyx987wvu654..." # real preview_id from --preview command
#
#  --- R2 (image storage, 10 GB free tier) ---
#  Create:  npx wrangler r2 bucket create soumdeco-images
#  Then uncomment:
#
#  [[r2_buckets]]
#  binding = "PRODUCT_IMAGES"
#  bucket_name = "soumdeco-images"
#
#  IMPORTANT: Cloudflare rejects placeholder IDs like "YOUR_KV_NAMESPACE_ID_HERE"
#  at deploy time. Only add the [[kv_namespaces]] section AFTER you have real IDs.
#  The R2 section doesn't need IDs (just the bucket name) so it's safe to add anytime.
#
#  All code uses optional chaining (env?.CATALOG_KV) so missing bindings
#  are handled gracefully — the site works without them.
# ============================================================

# ============================================================
#  ENVIRONMENT VARIABLES (set via Cloudflare dashboard)
# ============================================================
#  These are set in the Cloudflare Pages dashboard under
#  Settings → Environment variables, NOT in this file.
#
#  Required (already set):
#    NEXT_PUBLIC_SHEET_URL              — Google Apps Script URL
#    NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME  — "anhvhy4j"
#    NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET — "soumdeco"
#
#  Optional (for R2 image uploads, added later):
#    R2_PUBLIC_BASE_URL — e.g. "https://images.soumdeco.pages.dev"
# ============================================================
