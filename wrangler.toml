name = "soumdeco"
compatibility_date = "2024-09-01"
# CRITICAL: nodejs_compat_v2 is REQUIRED for Next.js API routes to work.
# Without it, the bundle's `import "async_hooks"` (without `node:` prefix)
# cannot be resolved → ALL /api/* routes return HTTP 500 at runtime.
# This was the ROOT CAUSE of the "items never update" bug — every previous
# deployment silently failed because the site root loaded (static HTML)
# but all Pages Functions (API routes) threw the async_hooks error.
# NOTE: Cannot use both nodejs_compat and nodejs_compat_v2 — pick one.
compatibility_flags = ["nodejs_compat_v2"]

# Required by Cloudflare Pages
pages_build_output_dir = ".vercel/output/static"

# ============================================================
#  KV NAMESPACE — Product + Stock cache (3-minute TTL)
# ============================================================
#  Caches the Google Apps Script response so the edge API routes
#  (/api/products, /api/stock) load instantly for returning visitors.
#  Falls back to Apps Script on cache miss.
#  NOTE: The frontend fetches directly from Apps Script (bypassing the
#  edge API), so KV is a bonus — it speeds up the /api/* fallback routes.
# ============================================================
[[kv_namespaces]]
binding = "CATALOG_KV"
id = "d16fd51d1d54497d8ff02b570e63e4e2"
preview_id = "d16fd51d1d54497d8ff02b570e63e4e2"

# ============================================================
#  R2 BUCKET — Image storage (DISABLED — needs credit card)
# ============================================================
#  R2 requires a credit card to enable (even though the free tier
#  covers 10 GB + zero egress). We're staying on Cloudinary for now
#  (25 GB storage + 25 GB bandwidth/month free, no credit card).
#
#  When you're ready to migrate to R2:
#    1. Add a credit card to your Cloudflare account
#    2. Run: npx wrangler r2 bucket create soumdeco-images
#    3. Uncomment the section below
#    4. Set R2_PUBLIC_BASE_URL env var in Cloudflare dashboard
#
#  [[r2_buckets]]
#  binding = "PRODUCT_IMAGES"
#  bucket_name = "soumdeco-images"
# ============================================================

# ============================================================
#  ENVIRONMENT VARIABLES (set via Cloudflare dashboard)
# ============================================================
#  These are set in the Cloudflare Pages dashboard under
#  Settings → Environment variables, NOT in this file.
#
#  Required (already set):
#    NEXT_PUBLIC_SHEET_URL              — Google Apps Script URL
#    NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME  — "anhvhy4j"
#    NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET — "soumdeco"
#
#  Optional (for R2 image uploads, added later):
#    R2_PUBLIC_BASE_URL — e.g. "https://images.soumdeco.pages.dev"
# ============================================================
